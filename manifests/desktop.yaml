# Applies the toolset, the example agent and the example workflow to the local
# Agent Mesh desktop app.
#   sam config plan  -m manifests/desktop.yaml
#   sam config apply -m manifests/desktop.yaml
kind: manifest
name: utlx-desktop
description: UTL-X toolset, example agent and mapping workflow on the local Agent Mesh desktop app
target:
  name: desktop
resources:
  toolsets:
    - utlx
  agents:
    - data-transformer
  workflows:
    - order-xml-to-invoice
